<span class="metric-label" [matTooltip]="tooltip || label" [matTooltipDisabled]="!(tooltip || label)">{{ label }}</span>
<span class="metric-value" [matTooltip]="tooltip || label" [matTooltipDisabled]="!(tooltip || label)">
  @if (disabledText) {
    {{ disabledText }}
  } @else if (value === null || value === undefined) {
    {{ fallback }}
  } @else {
    @switch (format) {
      @case ("percent") {
        {{ value | percent: digits }}
      }
      @case ("decimal") {
        {{ value | number: digits }}
      }
      @default {
        {{ value | number: digits }}
      }
    }
  }
</span>
