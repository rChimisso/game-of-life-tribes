<button mat-flat-button matTooltipClass="preset-tooltip" type="button" [class.selected]="isSelected" [matTooltip]="presetTooltip" [matTooltipDisabled]="!presetTooltip">
  <div class="preset-content">
    <span class="preset-heading">
      <span class="preset-packing">{{ requiredPackingLabel }}</span>
      <span class="preset-name">{{ preset.name }}</span>
    </span>
    <span class="preset-desc">{{ preset.description }}</span>
  </div>
</button>
