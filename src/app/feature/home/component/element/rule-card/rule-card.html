<div class="rule-header" title="" [class.muted]="rule.muted" (click)="toggleExpand.emit(ruleIndex)">
  <button cdkDragHandle class="drag-handle" title="Drag to reorder rule" type="button" (click)="$event.stopPropagation()" (pointerdown)="onDragHandlePointerDown($event)">
    <mat-icon>drag_indicator</mat-icon>
  </button>
  <mat-icon class="expand-icon" [title]="expanded ? 'Collapse rule' : 'Expand rule'">{{ expanded ? "expand_more" : "chevron_right" }}</mat-icon>
  <gol-summary class="rule-summary" [clause]="rule.clause" [tribeColors]="tribes" />
  <span class="rule-arrow" [title]="'Becomes ' + outputBecomeLabel()">&rarr;</span>
  @if (fixedOutputTribeId(); as tribeId) {
    <gol-tribe-swatch size="sm" [color]="outputTribeColor()" [interactive]="false" [title]="'Becomes ' + tribeId" />
  } @else {
    <span class="rule-become-label" [title]="'Becomes ' + outputBecomeLabel()">{{ outputBecomeLabel() }}</span>
  }
  <gol-button icon="content_copy" label="Duplicate rule" size="sm" title="Duplicate rule" variant="icon" (click)="onDuplicate($event)" />
  <gol-button size="sm" variant="icon" [icon]="rule.muted ? 'visibility' : 'visibility_off'" [label]="rule.muted ? 'Unmute rule' : 'Mute rule'" [title]="rule.muted ? 'Unmute rule' : 'Mute rule'" (click)="onToggleMute($event)" />
  <gol-button icon="delete" label="Delete rule" size="sm" title="Delete rule" variant="icon" (click)="onRemove($event)" />
</div>
<div class="collapsible" title="" [class.muted]="rule.muted" [class.open]="expanded">
  <div class="collapsible-inner">
    <div class="rule-body">
      <gol-rule-clause [baselineClause]="baselineRule?.clause ?? null" [clause]="rule.clause" [depth]="0" [disabled]="!!rule.muted" [path]="[]" [tribes]="tribes" (clauseChange)="onClauseChanged($event)" (clauseStateChange)="onClauseStateChanged($event)" />
      <div class="rule-output-row">
        <gol-become-editor [baselineBecome]="baselineBecome()" [become]="outputBecome()" [disabled]="!!rule.muted" [tribes]="tribes" (becomeChange)="onBecomeChanged($event)" (becomeStateChange)="onBecomeStateChanged($event)" />
      </div>
      @if (devMode) {
        <details class="rule-debug">
          <summary>Normalized rule</summary>
          <pre>{{ normalizedRuleJson() }}</pre>
        </details>
      }
    </div>
  </div>
</div>
