<div class="rule-header" title="" [class.muted]="rule.muted" (click)="toggleExpand.emit(ruleIndex)">
  <button cdkDragHandle class="drag-handle" title="Drag to reorder rule" type="button" (click)="$event.stopPropagation()" (pointerdown)="onDragHandlePointerDown($event)">
    <mat-icon>drag_indicator</mat-icon>
  </button>
  <mat-icon class="expand-icon" [title]="expanded ? 'Collapse rule' : 'Expand rule'">{{ expanded ? "expand_more" : "chevron_right" }}</mat-icon>
  <gol-summary class="rule-summary" [clause]="rule.clause" [tribeColors]="editTribes" />
  <span class="rule-arrow" [title]="'Becomes ' + rule.tribe">→</span>
  <gol-tribe-swatch size="sm" [color]="outputTribeColor()" [interactive]="false" [title]="'Becomes ' + rule.tribe" />
  <gol-button icon="content_copy" label="Duplicate rule" size="sm" title="Duplicate rule" variant="icon" (click)="onDuplicate($event)" />
  <gol-button size="sm" variant="icon" [icon]="rule.muted ? 'visibility' : 'visibility_off'" [label]="rule.muted ? 'Unmute rule' : 'Mute rule'" [title]="rule.muted ? 'Unmute rule' : 'Mute rule'" (click)="onToggleMute($event)" />
  <gol-button icon="delete" label="Delete rule" size="sm" title="Delete rule" variant="icon" (click)="onRemove($event)" />
</div>
<div class="collapsible" title="" [class.muted]="rule.muted" [class.open]="expanded">
  <div class="collapsible-inner">
    <div class="rule-body">
      <gol-rule-clause [baselineClause]="baselineRule?.clause ?? null" [clause]="rule.clause" [depth]="0" [editTribes]="editTribes" [path]="[]" (clauseChange)="onClauseChanged($event)" (clauseStateChange)="onClauseStateChanged($event)" />
      <div class="rule-output-row" [title]="'This cell will become ' + rule.tribe + ' if the above conditions are met'">
        <span class="rule-output-label">→ becomes</span>
        <gol-select class="tribe-select" [disabled]="!!rule.muted" [ngModel]="rule.tribe" [options]="tribeSelectOptions" (ngModelChange)="onSetRuleOutput($event)" />
      </div>
    </div>
  </div>
</div>
