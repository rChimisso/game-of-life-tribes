<div class="topology-row gol-cell-12 gol-grid-tiny" title="Grid topology and virtual boundary tribe">
  <gol-segmented-control class="gol-cell-8" label="Grid topology" [ngModel]="pendingTopology" [options]="topologyOptions" (ngModelChange)="onPendingTopologyChange($event)" />
  <gol-select class="gol-cell-4" title="Virtual boundary tribe for bounded grids" [disabled]="boundaryTribeDisabled" [ngModel]="pendingBoundaryTribe" [options]="boundaryTribeOptions" (ngModelChange)="onPendingBoundaryTribeChange($event)" />
</div>
<div class="gol-cell-12 gol-grid-tiny" title="Grid columns">
  <span class="input-label gol-cell-2">Cols</span>
  <gol-input class="gol-cell-5" name="columns" regex="^[1-9][0-9]*$" type="number" [ngModel]="pendingCols" (ngModelChange)="onPendingColsChange($event)" />
  <span class="gol-cell-5 error-message">{{ gridColsError }}</span>
</div>
<div class="gol-cell-12 gol-grid-tiny" title="Grid rows">
  <span class="input-label gol-cell-2">Rows</span>
  <gol-input class="gol-cell-5" name="rows" regex="^[1-9][0-9]*$" type="number" [ngModel]="pendingRows" (ngModelChange)="onPendingRowsChange($event)" />
  <span class="gol-cell-5 error-message">{{ gridRowsError }}</span>
</div>
<gol-frame-size-limits class="gol-cell-12" [frameBytes]="pendingGridFrameByteSize" [maxBytes]="maxBytes" (overAllowedLimitChange)="pendingGridOverAllowedFrameLimit = $event" />
<gol-button-pair class="gol-cell-12" [leftDisabled]="running || downloading || !hasUnappliedGridSize || pendingGridOverAllowedFrameLimit || !!(gridColsError || gridRowsError)" [rightDisabled]="downloading || !hasUnappliedGridSize" (leftClick)="onApplyGridSize()" (rightClick)="restoreGridSize()" />
