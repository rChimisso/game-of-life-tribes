<gol-progress-status [active]="snapshotProgressActive" [mode]="snapshotProgressMode" [percent]="snapshotProgressPercent" [status]="displayedSnapshotProgressStatus" />
<gol-button-pair leftIcon="save" leftLabel="Save" rightIcon="upload_file" rightLabel="Load" [leftDisabled]="snapshotActionsDisabled" [rightDisabled]="snapshotActionsDisabled" (leftClick)="saveState.emit()" (rightClick)="fileInput.click()" />
<input #fileInput accept=".golt,.json" hidden type="file" (change)="onFileSelect($event)" />
