<gol-progress-status [active]="snapshotProgressActive" [mode]="snapshotProgressMode" [percent]="snapshotProgressPercent" [status]="displayedSnapshotProgressStatus" />
<gol-button-pair leftIcon="save" leftLabel="Save" rightIcon="upload_file" rightLabel="Load" [leftDisabled]="snapshotSaveDisabled" [rightDisabled]="snapshotLoadDisabled" (leftClick)="saveState.emit()" (rightClick)="openFilePicker()" />
<input #fileInput accept=".golt" hidden type="file" (change)="onFileSelect($event)" />
