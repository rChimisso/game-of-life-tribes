<div class="gol-grid-tiny">
  <gol-input class="gol-cell-4" name="speed" regex="^[1-9][0-9]*$" title="Target speed" type="number" [disabled]="maxSpeed || liveControlDisabled" [ngModel]="speed" (ngModelChange)="onSpeedChange($event)" />
  <span class="speed-unit gol-cell-3" title="Target speed">gen/s</span>
  <gol-toggle-button class="gol-cell-5" label="Max" title="Toggle max speed" [disabled]="liveControlDisabled" [ngModel]="maxSpeed" (ngModelChange)="onMaxSpeedChange($event)" />
  <span class="warning-message gol-cell-7" title="">{{ recordingGateMessage }}</span>
  <gol-toggle-button class="gol-cell-5" label="Rec" title="Toggle recording" [disabled]="recordingDisabled" [ngModel]="recording" (ngModelChange)="onRecordingChange($event)" />
  <span class="warning-message gol-cell-7" title="">{{ liveMetricsMessage }}</span>
  <gol-toggle-button class="gol-cell-5" label="Metrics" title="Toggle live metrics" [disabled]="liveControlDisabled" [ngModel]="liveMetricsEnabled" (ngModelChange)="onLiveMetricsEnabledChange($event)" />
</div>
