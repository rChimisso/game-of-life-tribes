<button class="toggle-btn floating" mat-icon-button type="button" [class.hidden]="!collapsed" (click)="toggle()">
  <mat-icon>menu</mat-icon>
</button>
<div class="sidebar-panel" [class.layout-transition-disabled]="suppressClosedTransition" [class.open]="!collapsed" [style.--sheet-translate]="sheetTranslate" [style.width.px]="sidebarWidth">
  <div class="sheet-handle" (pointerdown)="onSheetDragStart($event)">
    <div class="sheet-handle-bar"></div>
  </div>
  <div class="sidebar-header">
    <span>Controls</span>
    <gol-button icon="close" label="Close" variant="icon" (clicked)="toggle()" />
  </div>
  <hr class="divider sidebar-divider" />
  <div class="sidebar-content">
    <gol-home-section description="Manage the simulation over time." title="Playback" [collapsible]="false">
      <gol-playback-section [backpressure]="backpressure" [downloading]="downloading" [engineBlocked]="engineBlocked" [generationCounter]="generationCounter" [metricsFps]="metrics?.fps ?? 0" [rebuilding]="rebuilding" [running]="running" [stepBackBaseDisabled]="chunksSaving || !metrics?.canStepBack" [stepping]="stepping" (restart)="emit({action: 'restart'})" (stepBack)="emit({action: 'stepBack', value: $event})" (stepForward)="emit({action: 'stepForward', value: $event})" (toggleRun)="emit({action: 'toggleRun'})" />
    </gol-home-section>
    <hr class="divider" />
    <gol-home-section description="Tune how quickly the simulation runs" title="Speed" [collapsible]="false">
      <gol-speed-section [downloading]="downloading" [engineBlocked]="engineBlocked" [liveMetricsEnabled]="liveMetricsEnabled" [maxSpeed]="maxSpeed" [recording]="recording" [recordingAvailable]="recordingAvailable" [recordingStorageAvailable]="recordingStorageAvailable" [speed]="speed" (liveMetricsEnabledChange)="onLiveMetricsEnabledChange($event)" (maxSpeedChange)="onMaxSpeedChange($event)" (recordingChange)="onRecordingChange($event)" (speedChange)="onSpeedChange($event)" />
    </gol-home-section>
    <hr class="divider" />
    <gol-home-section description="Select tribes to draw on the grid. Use the brush options to adjust how drawing works." title="Draw tribe" [collapsible]="false">
      <gol-draw-section [brushDensity]="brushDensity" [brushFill]="brushFill" [brushMaxSize]="brushMaxSize" [brushShape]="brushShape" [brushSize]="brushSize" [deleteMode]="deleteMode" [drawTribes]="drawTribes" [panMode]="panMode" [tribes]="tribes" (brushDensityChange)="onBrushDensityChange($event)" (brushFillChange)="onBrushFillChange($event)" (brushShapeChange)="onBrushShapeChange($event)" (brushSizeChange)="onBrushSizeChange($event)" (deleteModeToggle)="emit({action: 'deleteMode'})" (touchModeChange)="onTouchModeChange($event)" (tribeChange)="onTribeChange($event)" />
    </gol-home-section>
    <hr class="divider" />
    <gol-home-section description="Set the grid size and monitor VRAM usage." title="Grid size" [collapsible]="false" [info]="vramTitleSize + ' / ' + vramQuotaFormatted">
      <gol-storage-bar [segments]="vramSegments" [title]="vramBarTooltip" [total]="vramBarTotal" />
      <gol-grid-size-section [boundaryTribe]="ruleset.boundaryTribe" [downloading]="downloading" [gridCols]="gridCols" [gridRows]="gridRows" [maxBytes]="maxBytes" [running]="running" [simulationBitsPerCell]="simulationGridFormat.bitsPerCell" [topology]="ruleset.topology" [tribes]="tribes" (applyGridSize)="onGridSizeApply($event)" />
    </gol-home-section>
    <hr class="divider" />
    <gol-home-section description="Adjust how tightly cells are packed in memory. Fewer bits reduce VRAM usage and help larger grids, while more bits allow more cell states and simpler shaders, which can benefit smaller grids." preferenceKey="golt-home-section-packing-expanded" title="Packing" [info]="simulationGridFormat.bitsPerCell + ' bit active'">
      <gol-packing-section [downloading]="downloading" [gridCols]="gridCols" [gridRows]="gridRows" [maxBytes]="maxBytes" [running]="running" [simulationBitsPerCell]="simulationGridFormat.bitsPerCell" [tribeCount]="ruleset.tribes.length" (applyPacking)="onPackingApply($event)" />
    </gol-home-section>
    <hr class="divider" />
    <gol-home-section description="Explore preset rules that showcase the simulation's capabilities and interesting setups." preferenceKey="golt-home-section-presets-expanded" title="Presets">
      <gol-presets-section [downloading]="downloading" [running]="running" (applyPreset)="applyPreset($event)" />
    </gol-home-section>
    <hr class="divider" />
    <gol-home-section description="Add, edit and remove tribes." preferenceKey="golt-home-section-tribes-expanded" title="Tribes">
      <gol-tribes-section [boundaryTribe]="ruleset.boundaryTribe" [committedRules]="ruleset.rules" [committedTribes]="ruleset.tribes" [downloading]="downloading" [running]="running" [topology]="ruleset.topology" (applyTribes)="applyTribes($event)" />
    </gol-home-section>
    <hr class="divider" />
    <gol-home-section description="Define how the simulation behaves by adding, editing, and ordering rules. The first matching rule is applied; cells with no match become dead." preferenceKey="golt-home-section-rules-expanded" title="Rules">
      <gol-rules-section [committedRules]="ruleset.rules" [downloading]="downloading" [randomSeed]="ruleset.randomSeed" [running]="running" [tribes]="ruleset.tribes" (applyRules)="applyRules($event)" />
    </gol-home-section>
    <hr class="divider" />
    <gol-home-section description="Monitor key simulation metrics. Values refresh once per second, or every generation below 1 gen/s." preferenceKey="golt-home-section-metrics-expanded" title="Metrics">
      <gol-metrics-section [diversityExpanded]="diversityExpanded" [interfacesExpanded]="interfacesExpanded" [liveMetricSettings]="liveMetricSettings" [liveMetricsEnabled]="liveMetricsEnabled" [metrics]="metrics" [populationExpanded]="populationExpanded" [tribes]="tribes" (diversityExpandedChange)="onDiversityExpandedChange($event)" (interfacesExpandedChange)="onInterfacesExpandedChange($event)" (populationExpandedChange)="onPopulationExpandedChange($event)" (settingsChange)="onLiveMetricSettingsChange($event)" />
    </gol-home-section>
    <hr class="divider" />

    <!-- Download -->
    <gol-home-section title="Download" [collapsible]="false" [description]="'Download recorded simulation data. Select the types and range of data you want to download.'" [info]="downloadStorageTitleSize + ' / ' + downloadStorageQuotaFormatted">
      <gol-download-section [chunksSaving]="chunksSaving" [downloadCancelling]="downloadCancelling" [downloadEstimateExceedsChunkThreshold]="downloadEstimateExceedsChunkThreshold" [downloadMainStatus]="downloadMainStatus" [downloadProgress]="downloadProgress" [loadingState]="loadingState" [running]="running" [savingState]="savingState" [stepping]="stepping" [storageCompressedBytes]="storageCompressedBytes" [storagePendingRawBytes]="storagePendingRawBytes" [storageQuotaBytes]="storageQuotaBytes" [storageReservedBytes]="storageReservedBytes" [totalRecordedFrames]="metrics?.totalFrames ?? 0" (cancelDownload)="emit({action: 'cancelDownload'})" (download)="emit({action: 'download', value: $event})" (settingsChange)="emit({action: 'downloadSettingsChange', value: $event})" />
    </gol-home-section>

    <hr class="divider" />

    <!-- Snapshot -->
    <gol-home-section title="Snapshot" [collapsible]="false" [description]="'Save or load a .golt snapshot file.'">
      <gol-snapshot-section [downloading]="downloading" [engineBlocked]="engineBlocked" [loadingState]="loadingState" [running]="running" [savingState]="savingState" [snapshotProgressMode]="snapshotProgressMode" [snapshotProgressPercent]="snapshotProgressPercent" [snapshotProgressStatus]="snapshotProgressStatus" [stepping]="stepping" (loadState)="emit({action: 'loadState', value: $event})" (saveState)="emit({action: 'saveState'})" />
    </gol-home-section>

    <hr class="divider shortcuts-divider" />
    <gol-home-section class="shortcuts-section" description="Keyboard and mouse shortcuts for controlling and interacting with the simulation." preferenceKey="golt-home-section-shortcuts-expanded" title="Shortcuts">
      <gol-shortcuts-section />
    </gol-home-section>
  </div>
  <gol-home-footer />
  <div class="resize-handle" (pointerdown)="onResizeStart($event)"></div>
</div>
