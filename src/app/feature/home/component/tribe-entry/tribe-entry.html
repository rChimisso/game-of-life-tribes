@if (tribe) {
  <div class="tribe-edit-row">
    <gol-tribe-swatch class="tribe-color-swatch" size="base" [color]="headerColor" [interactive]="false" [title]="headerName" />
    <span class="tribe-id">{{ headerName }}</span>
    <gol-button size="sm" variant="icon" [disabled]="editing && (!canConfirmEdit || !hasPendingChanges)" [icon]="editing ? 'check' : 'edit'" [title]="editing ? 'Apply tribe changes' : 'Edit tribe'" (clicked)="editing ? onSave() : openEditor()" />
    <gol-button size="sm" icon="close" title="Discard tribe changes" variant="icon" [disabled]="!editing" (clicked)="cancelEdit()" />
    <gol-button size="sm" icon="delete" title="Remove tribe" variant="icon" (clicked)="onRemove()" />
  </div>
}
<div class="tribe-editor" [attr.aria-hidden]="!showEditor" [class.open]="showEditor">
  <div class="tribe-editor-inner">
    <gol-input name="tribeName" placeholder="Name (A-z, 0-9)" regex="^[0-9a-zA-Z]*$" [ngModel]="currentName" (ngModelChange)="onCurrentNameChange($event)" />
    <div class="color-palette">
      @for (c of basicColors; track c) {
        <gol-tribe-swatch class="color-swatch" size="base" [color]="c" [selected]="isColorSelected(c)" [title]="'#' + c" (clicked)="onCurrentColorChange(c)" />
      }
      <button class="color-swatch random-swatch" type="button" (click)="onCurrentColorChange(randomColor())">🎲</button>
    </div>
    <div class="hex-row">
      <span class="hex-hash">#</span>
      <gol-input class="hex-input" name="tribeHex" regex="^[0-9a-fA-F]{0,6}$" [ngModel]="currentColor" (ngModelChange)="onCurrentColorChange($event)" />
      <input class="native-picker" type="color" [value]="nativeColor(currentColor)" (input)="onCurrentColorChange($event.target.value)" />
    </div>
    @if (isAdder) {
      <gol-button-pair leftIcon="add" leftLabel="Add" rightIcon="close" rightLabel="Cancel" [leftDisabled]="!canConfirmAdd" (leftClick)="onSave()" (rightClick)="cancelAdd.emit()" />
    }
  </div>
</div>
