<gol-sidebar [brushFill]="brushFill" [brushShape]="brushShape" [brushSize]="brushSize" [deleteMode]="deleteMode" [downloadProgress]="downloadProgress" [drawTribe]="drawTribe" [gridCols]="ruleset.cols" [gridRows]="ruleset.rows" [maxCells]="maxCells" [maxSpeed]="maxSpeed" [metrics]="latestMetrics" [ruleset]="ruleset" [running]="state === 'running'" [skipAmount]="skipAmount" [speed]="speed" [tribes]="tribes" (sidebarEvent)="onSidebarEvent($event)" />
<section class="canvas-section">
  <gol-engine [brushFill]="brushFill" [brushShape]="brushShape" [brushSize]="brushSize" [drawTribe]="drawTribe" [ruleset]="ruleset" [speed]="effectiveSpeed" [state]="state" (limits)="onLimits($event)" (metrics)="onMetrics($event)" (recording)="onRecording($event)" (snapshot)="onSnapshot($event)" (stepping)="onStepping($event)" />
  @if (maxSpeed) {
    <div class="max-speed-overlay">
      <mat-icon>speed</mat-icon>
      <span>Max speed enabled — rendering paused</span>
      <span class="max-speed-hint">Disable max speed to render again</span>
    </div>
  }
  @if (stepping) {
    <div class="max-speed-overlay">
      <mat-icon>fast_forward</mat-icon>
      <span>Skipping to target generation…</span>
      <span class="max-speed-hint">Please wait</span>
    </div>
  }
</section>
