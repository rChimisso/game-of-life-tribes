<div class="gol-grid-tiny">
  <gol-button class="gol-cell-6" variant="flat" [disabled]="leftDisabled" [icon]="leftIcon" [label]="leftLabel" [tooltip]="leftDisabled ? '' : leftLabel" [type]="leftType" (clicked)="leftClick.emit()" />
  <gol-button class="gol-cell-6" variant="flat" [disabled]="rightDisabled" [icon]="rightIcon" [label]="rightLabel" [tooltip]="rightDisabled ? '' : rightLabel" [type]="rightType" (clicked)="rightClick.emit()" />
</div>
