<mat-slide-toggle class="gol-material-theme gol-slide-toggle" [checked]="value" [class.size-sm]="size === 'sm'" [disableRipple]="true" [disabled]="disabled" [matTooltip]="tooltip || label" [matTooltipDisabled]="!(tooltip || label)" (blur)="touch()" (change)="onToggleChange($event)">{{ label }}</mat-slide-toggle>
