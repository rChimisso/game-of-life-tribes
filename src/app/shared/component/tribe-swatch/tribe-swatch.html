@if (interactive) {
  <button class="swatch" type="button" [attr.aria-label]="title" [class.selected]="selected" [class.size-md]="size === 'md'" [class.size-sm]="size === 'sm'" [class.size-xs]="size === 'xs'" [style.background-color]="color ? '#' + color : null" [title]="title" (click)="emitClick($event)"></button>
} @else {
  <span class="swatch" [attr.aria-label]="title" [class.selected]="selected" [class.size-md]="size === 'md'" [class.size-sm]="size === 'sm'" [class.size-xs]="size === 'xs'" [style.background-color]="color ? '#' + color : null" [title]="title"></span>
}
